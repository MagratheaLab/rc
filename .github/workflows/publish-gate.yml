# Publish the Lean 4.33.0 gate image. Agents pull this digest; they do not rebuild.
name: publish-gate

on:
  push:
    branches: [main]
    paths:
      - "gate/Dockerfile"
      - ".github/workflows/publish-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: gate
          push: true
          provenance: false
          tags: |
            ghcr.io/magrathealab/gate:lean-4.33.0
            ghcr.io/magrathealab/gate:latest
      - name: digest
        run: echo "digest=${{ steps.push.outputs.digest }}"
