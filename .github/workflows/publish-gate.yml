# Publish the Lean 4.33.0 gate image. Agents pull this digest; they do not rebuild.
name: publish-gate

on:
  push:
    branches: [main]
    paths:
      - "gate/Dockerfile"
      - ".github/workflows/publish-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: gate
          push: true
          provenance: false
          tags: |
            ghcr.io/magrathealab/gate:lean-4.33.0
            ghcr.io/magrathealab/gate:latest
      - name: digest
        run: echo "digest=${{ steps.push.outputs.digest }}"
