name: t0-t3

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e .
      - name: T0-T3
        run: python -m unittest discover -s tests -t . -v
      - name: build gate image
        run: docker build -t magrathea-gate:lean-4.33.0 gate
      - name: pin local digest and lake-build fixture
        run: |
          ID=$(docker inspect --format='{{.Id}}' magrathea-gate:lean-4.33.0)
          echo "image id $ID"
          python -m unittest tests.test_t3_gates.TestDockerLake -v
